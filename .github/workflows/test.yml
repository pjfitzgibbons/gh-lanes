name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token, and no secrets anywhere in this file: requirement G3.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Floor from requires-python, and the newest release.
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to a commit SHA, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # --locked fails if uv.lock is stale rather than silently re-resolving.
      - run: uv sync --locked

      # -v names every test in the log; the annotate-failures plugin pins each
      # failure to its line in the PR diff; md-report writes the job summary.
      - name: pytest
        run: >
          uv run pytest -v
          --cov --cov-report=term
          --md-report --md-report-verbose 0
          --md-report-flavor github --md-report-color never --md-report-zeros empty
          --md-report-output "$GITHUB_STEP_SUMMARY"

      - name: coverage summary
        if: ${{ !cancelled() }}
        run: |
          echo "### Coverage (py${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
