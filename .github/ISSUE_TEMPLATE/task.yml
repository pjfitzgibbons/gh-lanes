# The issue outline in docs/agents/technical-writer.md §3. Each field posts as a ### section,
# the same shape as drafts created with gh issue create --body-file.
name: Task
description: One unit of work, what to deliver and how you know it's done.
title: "[N] "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: The outcome and why, in one to three sentences. Link the design section by anchor.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's in. Add "Out of scope:" only when someone might assume it's in.
      placeholder: "- "
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Testable statements, one per bullet.
      placeholder: "- "
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: What the suite proves.
  - type: textarea
    id: lenses
    attributes:
      label: Lenses
      description: Mark a relevant lens [x] and add a note after the colon. Leave the rest [ ] with no note.
      value: |
        - [ ] L1 Security
        - [ ] L2 Privacy and data
        - [ ] L3 Reliability and failure
        - [ ] L4 Performance and limits
        - [ ] L5 Observability
        - [ ] L6 Compatibility and migration
        - [ ] L7 Usability and accessibility
        - [ ] L8 Testability
        - [ ] L9 Operations and cost
        - [ ] L10 Docs impact
        - [ ] L11 Invariants
        - [ ] L12 Offline and concurrency
  - type: textarea
    id: planning
    attributes:
      label: Planning
      description: "Estimate is 1, 2, 3 or 5; above 5, split the issue. Lanes: cli, engine, github, infra, model, web."
      value: |
        - Backlog ID:
        - Estimate:
        - Lane:
        - Milestone:
