[project]
name = "gh-lanes"
version = "0.0.0"
description = "A planning layer over GitHub Issues: estimates, lanes, dependencies and baselines."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ghlanes"

[tool.pytest.ini_options]
# The hook's suite is plain unittest; pytest collects it so one command runs everything.
testpaths = ["tests", ".claude/hooks"]
# -ra: end-of-run summary naming every skip, xfail and failure, so nothing passes silently.
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["ghlanes"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pytest-md-report>=0.8.0",
]
